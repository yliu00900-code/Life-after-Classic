const infectedHome=new THREE.Vector3(.8,0,2);let infectedMode='wander',wanderClock=0,attackClock=0,playerHP=100,infectedHP=100,infectedAlive=true,attackCooldown=0,hitFlash=0;
let infectedDying=false,deathTimer=0,deathDropCreated=false,audioContext=null;
function playImpactSound(isDeath=false){try{audioContext=audioContext||new (window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type=isDeath?'triangle':'sine';osc.frequency.setValueAtTime(isDeath?105:145,audioContext.currentTime);osc.frequency.exponentialRampToValueAtTime(isDeath?48:62,audioContext.currentTime+.16);gain.gain.setValueAtTime(.0001,audioContext.currentTime);gain.gain.exponentialRampToValueAtTime(isDeath?.16:.11,audioContext.currentTime+.012);gain.gain.exponentialRampToValueAtTime(.0001,audioContext.currentTime+.2);osc.connect(gain);gain.connect(audioContext.destination);osc.start();osc.stop(audioContext.currentTime+.21)}catch(e){}}
function spawnInfectedLoot(){if(deathDropCreated)return;deathDropCreated=true;const dropPos=infected.position.clone();lootDrop=new THREE.Group();lootDrop.position.set(dropPos.x,0,dropPos.z);const pouch=new THREE.Mesh(new THREE.BoxGeometry(.48,.34,.38),new THREE.MeshStandardMaterial({color:0x8b7045,roughness:.9}));pouch.position.y=.28;pouch.castShadow=true;lootDrop.add(pouch);const strap=new THREE.Mesh(new THREE.BoxGeometry(.5,.07,.4),new THREE.MeshStandardMaterial({color:0x3b4030}));strap.position.y=.47;lootDrop.add(strap);const ring=new THREE.Mesh(new THREE.TorusGeometry(.48,.035,6,24),new THREE.MeshBasicMaterial({color:0xd6b66b}));ring.rotation.x=Math.PI/2;ring.position.y=.06;lootDrop.add(ring);scene.add(lootDrop);hint.textContent='感染者倒下了！靠近掉落物点击交互拾取'}
const hpText=document.querySelector('#hpText'),hpFill=document.querySelector('#hpFill'),enemyText=document.querySelector('#enemyText');
const enemyHealth=document.querySelector('#enemyHealth'),enemyHPText=document.querySelector('#enemyHPText'),enemyHPFill=document.querySelector('#enemyHPFill');
document.querySelector('#attack').addEventListener('click',()=>{if(!infectedAlive||infectedDying){hint.textContent='附近没有可攻击的感染者';return}const d=Math.hypot(player.position.x-infected.position.x,player.position.z-infected.position.z);if(d>2.8){hint.textContent='距离太远，靠近感染者再攻击';return}if(attackCooldown>0)return;attackCooldown=.55;infectedHP=Math.max(0,infectedHP-25);enemyHealth.style.display='block';enemyHPText.textContent=infectedHP;enemyHPFill.style.width=infectedHP+'%';hitFlash=.22;infected.userData.hitKick=.18;zombieBody.material.emissive.setHex(0x7a2118);zombieBody.material.emissiveIntensity=1.2;infected.position.x+=(infected.position.x-player.position.x)*.12;infected.position.z+=(infected.position.z-player.position.z)*.12;playImpactSound(infectedHP===0);if(infectedHP===0){infectedDying=true;deathTimer=0;enemyText.textContent='感染者正在倒下…';hint.textContent='感染者受到致命一击！'}else{hint.textContent='命中感染者！生命值 -25'}});
function updateInfected(dt){
 if(!infectedAlive)return;attackCooldown=Math.max(0,attackCooldown-dt);if(hitFlash>0){hitFlash-=dt;if(hitFlash<=0){zombieBody.material.emissive.setHex(0x000000);zombieBody.material.emissiveIntensity=0}}if(infectedDying){deathTimer+=dt;const fallProgress=THREE.MathUtils.clamp(deathTimer/1.25,0,1);infected.rotation.x=THREE.MathUtils.lerp(infected.rotation.x,-1.28,Math.min(1,dt*3.8));infected.rotation.z=THREE.MathUtils.lerp(infected.rotation.z,-.12,Math.min(1,dt*2));infected.position.z-=dt*.12;infected.position.y=0;if(deathTimer>1.25&&!deathDropCreated){spawnInfectedLoot();enemyText.textContent='感染者已被击败'}if(deathTimer>4.2){scene.remove(infected);infectedAlive=false}return}if(infected.userData.hitKick>0){infected.userData.hitKick=Math.max(0,infected.userData.hitKick-dt);infected.scale.setScalar(1.12+Math.sin(infected.userData.hitKick*35)*.055)}else infected.scale.setScalar(1.12);
 const dx=player.position.x-infected.position.x,dz=player.position.z-infected.position.z,dist=Math.hypot(dx,dz);const animTime=clock.elapsedTime;const gait=infectedMode==='chase'&&dist>1.35?1:infectedMode==='wander'?.35:0;for(const limb of infectedArms){limb.mesh.rotation.x=Math.sin(animTime*7+limb.side*Math.PI)*.48*gait;limb.mesh.rotation.z=limb.side*(.22+(infectedMode==='chase'?.2:0));}for(const limb of infectedLegs){limb.mesh.rotation.x=Math.sin(animTime*7+limb.side*Math.PI)*.28*gait;}infected.userData.attackAnim=Math.max(0,(infected.userData.attackAnim||0)-dt);const attackSwing=infected.userData.attackAnim>0?Math.sin((1-infected.userData.attackAnim/.32)*Math.PI)*.9:0;infectedArms[0].mesh.rotation.x-=attackSwing;infectedArms[1].mesh.rotation.x-=attackSwing*.45;
 const nightFactor=daylight<.18?1:0;if(dist<10+nightFactor*3)infectedMode='chase';else if(dist>15+nightFactor*3)infectedMode='wander';
 if(infectedMode==='chase'&&dist>1.35){infected.position.x+=dx/dist*dt*1.05;infected.position.z+=dz/dist*dt*1.05;infected.rotation.y=Math.atan2(dx,dz)}
 else if(infectedMode==='wander'){wanderClock+=dt;const a=Math.sin(wanderClock*.55)*.45;infected.position.x=infectedHome.x+Math.sin(wanderClock*.35)*1.8;infected.position.z=infectedHome.z+Math.cos(wanderClock*.35)*1.8;infected.rotation.y=a}
 if(infectedMode==='chase'&&dist<=1.45){attackClock-=dt;if(attackClock<=0){const damage=daylight<.18?10:8;playerHP=Math.max(0,playerHP-damage);attackClock=1.5;infected.userData.attackAnim=.32;hpText.textContent=playerHP;hpFill.style.width=playerHP+'%';playImpactSound(false);hint.textContent=playerHP>0?'感染者攻击了你！生命值 -'+damage:'你已倒下，请重新开始';}}
 else attackClock=0;
 enemyText.textContent=dist<10?'附近：感染者正在追击！':'附近：感染者游荡中';
}

const shadow=new THREE.Mesh(new THREE.CircleGeometry(.65,20),new THREE.MeshBasicMaterial({color:0x11150f,transparent:true,opacity:.35}));shadow.rotation.x=-Math.PI/2;shadow.position.y=.015;player.add(shadow);
let yaw=0,moveX=0,moveY=0,cameraYaw=0,cameraPitch=.18;
const clock=new THREE.Clock();
const joy=document.querySelector('#joy'),stick=document.querySelector('#stick');let joyId=null;
function setJoy(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=43,l=Math.hypot(dx,dy);if(l>max){dx=dx/l*max;dy=dy/l*max}moveX=dx/max;moveY=dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`}
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(joyId);setJoy(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)setJoy(e)});
function endJoy(){joyId=null;moveX=moveY=0;stick.style.transform='translate(0,0)'}
joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);
const look=document.querySelector('#look');let lookId=null,lastX=0,lastY=0;
look.addEventListener('pointerdown',e=>{lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;look.setPointerCapture(lookId)});
look.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;cameraYaw-=(e.clientX-lastX)*.006;cameraPitch=THREE.MathUtils.clamp(cameraPitch+(e.clientY-lastY)*.004,-.05,.75);lastX=e.clientX;lastY=e.clientY});
function endLook(){lookId=null}look.addEventListener('pointerup',endLook);look.addEventListener('pointercancel',endLook);
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let wood=0,stone=0,infectedLoot=0,lootDrop=null;
const hint=document.querySelector('#hint'),action=document.querySelector('#action');
function nearest(list){let found=null,dist=3.2;for(const obj of list){const d=Math.hypot(obj.position.x-player.position.x,obj.position.z-player.position.z);if(d<dist){dist=d;found=obj}}return found}
function refreshInventory(){document.querySelector('#wood').textContent=wood;document.querySelector('#stone').textContent=stone;document.querySelector('#bagWood').textContent=wood;document.querySelector('#bagStone').textContent=stone;document.querySelector('#infectedLoot').textContent=infectedLoot;document.querySelector('#bagLoot').textContent=infectedLoot}
const bagPanel=document.querySelector('#bagPanel');
document.querySelector('#bagButton').addEventListener('click',()=>{bagPanel.classList.add('open');bagPanel.setAttribute('aria-hidden','false')});
function closeBag(){bagPanel.classList.remove('open');bagPanel.setAttribute('aria-hidden','true')}
document.querySelector('#bagClose').addEventListener('click',closeBag);
bagPanel.addEventListener('click',e=>{if(e.target===bagPanel)closeBag()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeBag()});
action.addEventListener('click',()=>{
 if(lootDrop&&Math.hypot(lootDrop.position.x-player.position.x,lootDrop.position.z-player.position.z)<3.2){scene.remove(lootDrop);lootDrop=null;infectedLoot+=1;refreshInventory();hint.textContent='拾取感染者物资 ×1';return}
 const t=nearest(trees),r=nearest(rocks);
 if(t){t.userData.hits++;if(t.userData.hits>=3){scene.remove(t);trees.splice(trees.indexOf(t),1);wood+=3;refreshInventory();hint.textContent='获得木头 ×3'}else{hint.textContent='正在砍伐树木…（'+t.userData.hits+'/3）'}}
 else if(r){r.userData.hits++;if(r.userData.hits>=2){scene.remove(r);rocks.splice(rocks.indexOf(r),1);stone+=2;refreshInventory();hint.textContent='获得石头 ×2'}else{hint.textContent='正在采集石块…（1/2）'}}
 else{hint.textContent='靠近树木或石块后才能采集'}
 setTimeout(()=>{if(hint.textContent!=='秋日森林 · 安全区外围')hint.textContent='秋日森林 · 安全区外围'},1700)
});
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);updateWorld(dt);updateSurvival(dt);
let ix=moveX+(keys.d?1:0)-(keys.a?1:0),iy=moveY+(keys.s?1:0)-(keys.w?1:0);const len=Math.hypot(ix,iy);if(len>1){ix/=len;iy/=len}
const moving=Math.hypot(ix,iy)>.08;
if(moving){const forward=new THREE.Vector3(Math.sin(cameraYaw),0,Math.cos(cameraYaw));const right=new THREE.Vector3(forward.z,0,-forward.x);const dir=forward.multiplyScalar(-iy).add(right.multiplyScalar(ix)).normalize();player.position.addScaledVector(dir,dt*3.2);yaw=Math.atan2(dir.x,dir.z);player.rotation.y=THREE.MathUtils.lerp(player.rotation.y,yaw,Math.min(1,dt*10))}
updateInfected(dt);
const target=new THREE.Vector3(player.position.x,1.25,player.position.z);
const distance=6.3, horiz=Math.cos(cameraPitch)*distance, vert=Math.sin(cameraPitch)*distance+1.4;
const desired=new THREE.Vector3(target.x+Math.sin(cameraYaw)*horiz,target.y+vert,target.z+Math.cos(cameraYaw)*horiz);
camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(target);
renderer.render(scene,camera)}
try{animate();document.querySelector('#loading').style.display='none'}catch(err){document.querySelector('#loading').textContent='场景启动失败：'+(err&&err.message?err.message:'未知错误');console.error(err)}
addEventListener('error',e=>{const panel=document.querySelector('#loading');if(panel&&panel.style.display!=='none'){panel.textContent='加载错误：'+(e.message||'请刷新重试')}});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});
</script>
</body></html>
