<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111812">
<title>LifeAfter Classic · V0.3</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101812;color:#e8eee5;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#vignette{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(5,12,8,.52),transparent 25%,transparent 65%,rgba(5,10,7,.5)),radial-gradient(ellipse,transparent 45%,rgba(0,0,0,.38))}
#top{position:fixed;top:env(safe-area-inset-top,12px);left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.brand{font-size:12px;letter-spacing:2px;color:#d5dfcc;text-shadow:0 2px 8px #000}.brand b{display:block;font-size:17px;letter-spacing:1px;color:#f1f3e9}
#status{font-size:11px;color:#d1d9c9;text-align:right;text-shadow:0 2px 8px #000}
#hint{position:fixed;top:76px;left:50%;transform:translateX(-50%);padding:7px 12px;border:1px solid #b8c3a044;border-radius:4px;background:#111a13a8;font-size:11px;color:#dce4d2;white-space:nowrap;pointer-events:none}
#controls{position:fixed;inset:0;pointer-events:none}
#joy{position:absolute;left:25px;bottom:calc(25px + env(safe-area-inset-bottom));width:126px;height:126px;border:1px solid #e2ead044;border-radius:50%;background:#dce8d00e;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:52px;height:52px;left:36px;top:36px;border-radius:50%;background:linear-gradient(145deg,#d9e0c9bb,#71836caa);border:1px solid #eef5df88;box-shadow:0 4px 16px #0008}
#look{position:absolute;right:0;bottom:0;width:54%;height:66%;pointer-events:auto;touch-action:none}
#action{position:absolute;right:24px;bottom:calc(27px + env(safe-area-inset-bottom));width:66px;height:66px;border:1px solid #d8e1c877;border-radius:50%;background:#253326bb;color:#f2f2df;font-size:12px;pointer-events:auto}
#action:active{background:#65724d}#attack:active{background:#9a4938}
#inventory{position:fixed;top:116px;left:14px;padding:8px 10px;border:1px solid #c5d0b044;border-radius:4px;background:#111a13b8;font-size:12px;line-height:1.7;color:#e0e7d6;text-shadow:0 1px 4px #000;pointer-events:none}
#bagButton{position:fixed;top:76px;right:14px;padding:9px 15px;border:1px solid #d8e1c877;border-radius:4px;background:#253326dd;color:#f2f2df;font-size:12px;pointer-events:auto}
#bagPanel{position:fixed;inset:0;display:none;place-items:center;background:#050905b9;z-index:4;padding:22px}
#bagPanel.open{display:grid}
.bag-card{width:min(340px,100%);padding:18px;border:1px solid #aeb99a88;border-radius:6px;background:linear-gradient(145deg,#263126,#111812);box-shadow:0 16px 50px #000b}
.bag-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:17px;letter-spacing:2px}
#bagClose{border:1px solid #aeb99a66;background:#303b2e;color:#e8eee5;border-radius:4px;padding:6px 11px}
.bag-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bag-slot{min-height:104px;padding:13px;border:1px solid #aeb99a44;border-radius:4px;background:#0b120dbb}
.bag-icon{font-size:28px;margin-bottom:8px}.bag-name{font-size:12px;color:#cbd5c1}.bag-count{float:right;font-size:18px;color:#f3f0d9;font-weight:700}
.bag-note{margin-top:14px;font-size:11px;color:#aeb99a}
#foot{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:10px;color:#d4ddc888;white-space:nowrap;pointer-events:none}
#threat{position:fixed;top:164px;left:14px;width:142px;padding:7px 9px;border:1px solid #b8c3a044;border-radius:4px;background:#111a13b8;font-size:11px;color:#e5dfd0;text-shadow:0 1px 4px #000;pointer-events:none}#hpTrack{height:5px;margin-top:5px;background:#4a302b;border-radius:5px;overflow:hidden}#hpFill{height:100%;width:100%;background:#b65b4d;transition:width .2s}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#111812;z-index:5;color:#dfe7d7;font-size:13px;letter-spacing:2px}
@media(min-width:800px){#joy{width:140px;height:140px}#stick{left:43px;top:43px}#look{width:58%}}

#attack{position:fixed!important;z-index:20!important;display:grid;place-items:center;right:22px!important;bottom:calc(112px + env(safe-area-inset-bottom))!important;width:66px!important;height:66px!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important;border:2px solid #e8b09a!important;border-radius:50%!important;background:#7b3328!important;color:#fff4e8!important;font-size:14px!important;font-weight:700!important;box-shadow:0 3px 14px #000b!important}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="game"></div><div id="vignette"></div>
<div id="top"><div class="brand">SURVIVAL PROJECT<b>LIFEAFTER CLASSIC</b></div><div id="status">V0.3 · COMBAT TEST<br>DAY 01　08:40</div></div>
<div id="hint">秋日森林 · 安全区外围</div><div id="threat">幸存者状态　生命值 <b id="hpText">100</b>/100<div id="hpTrack"><div id="hpFill"></div></div><div id="enemyText">附近：暂未发现感染者</div><div id="enemyHealth" style="display:none;margin-top:6px">感染者 <b id="enemyHPText">100</b>/100<div id="enemyHPTrack" style="height:5px;margin-top:4px;background:#4a302b;border-radius:5px;overflow:hidden"><div id="enemyHPFill" style="height:100%;width:100%;background:#a9a35c;transition:width .15s"></div></div></div></div><div id="inventory">背包资源<br>木头：<b id="wood">0</b>　石头：<b id="stone">0</b></div>
<button id="bagButton" aria-label="打开背包">背包</button><div id="bagPanel" aria-hidden="true"><div class="bag-card"><div class="bag-head"><span>生存背包</span><button id="bagClose">关闭</button></div><div class="bag-grid"><div class="bag-slot"><div class="bag-icon">🪵</div><span class="bag-name">木头</span><span class="bag-count" id="bagWood">0</span></div><div class="bag-slot"><div class="bag-icon">🪨</div><span class="bag-name">石头</span><span class="bag-count" id="bagStone">0</span></div></div><div class="bag-note">资源会在采集成功后自动存入背包</div></div></div>
<div id="controls"><div id="look" aria-label="拖动旋转视角"></div><div id="joy"><div id="stick"></div></div><button id="action">交互</button></div>
<button id="attack" aria-label="攻击感染者">攻击</button>
<div id="foot">靠近资源后点击交互采集</div>
<div id="loading">正在生成森林环境…</div>
<script type="module">
import * as THREE from 'three';
const mount=document.querySelector('#game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x89938a);
scene.fog=new THREE.FogExp2(0x89938a,0.018);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,180);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
mount.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xcbd6d0,0x35402d,2.0));
const sun=new THREE.DirectionalLight(0xffe2b6,2.3);sun.position.set(-18,30,12);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-32;sun.shadow.camera.right=32;sun.shadow.camera.top=32;sun.shadow.camera.bottom=-32;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),new THREE.MeshStandardMaterial({color:0x4a5140,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.08;ground.receiveShadow=true;scene.add(ground);
// Uneven forest floor patches
for(let i=0;i<90;i++){const g=new THREE.CircleGeometry(THREE.MathUtils.randFloat(1,4),12);const m=new THREE.MeshStandardMaterial({color:[0x555442,0x3e4938,0x68614a,0x454b3d][i%4],roughness:1});const p=new THREE.Mesh(g,m);p.rotation.x=-Math.PI/2;p.position.set(THREE.MathUtils.randFloatSpread(95),-.055,THREE.MathUtils.randFloatSpread(95));p.scale.y=THREE.MathUtils.randFloat(.5,1.4);scene.add(p)}
// Faint muddy trail
const trail=new THREE.Mesh(new THREE.PlaneGeometry(5,95),new THREE.MeshStandardMaterial({color:0x75664c,roughness:1}));trail.rotation.x=-Math.PI/2;trail.position.set(0,-.045,-16);trail.rotation.z=.09;scene.add(trail);
const trunkMat=new THREE.MeshStandardMaterial({color:0x514235,roughness:1});
const leafMats=[0x3f5140,0x4b5b43,0x59634a,0x394b3d].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:1}));
const trees=[];
function tree(x,z,s=1){const group=new THREE.Group();group.position.set(x,0,z);group.scale.setScalar(s);group.userData.hits=0;
const h=THREE.MathUtils.randFloat(4.5,7.8);const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.16,.32,h,7),trunkMat);trunk.position.y=h/2;trunk.castShadow=true;group.add(trunk);
for(let j=0;j<3;j++){const crown=new THREE.Mesh(new THREE.ConeGeometry(THREE.MathUtils.randFloat(1.5,2.3),THREE.MathUtils.randFloat(3,4.2),7),leafMats[Math.floor(Math.random()*leafMats.length)]);crown.position.y=h*.63+j*.82;crown.rotation.y=Math.random()*3;crown.castShadow=true;group.add(crown)}
scene.add(group);trees.push(group)}
for(let i=0;i<115;i++){let x,z;do{x=THREE.MathUtils.randFloatSpread(92);z=THREE.MathUtils.randFloatSpread(92)}while(Math.abs(x)<5&&z>-30&&z<22);tree(x,z,THREE.MathUtils.randFloat(.75,1.35))}
// Guaranteed starter tree beside spawn for the first gathering tutorial
tree(2.2,7.5,1.05);
const rockMat=new THREE.MeshStandardMaterial({color:0x66675e,roughness:1});const rocks=[];
for(let i=0;i<34;i++){const r=new THREE.Mesh(new THREE.DodecahedronGeometry(THREE.MathUtils.randFloat(.35,1.25),0),rockMat);r.position.set(THREE.MathUtils.randFloatSpread(75),.3,THREE.MathUtils.randFloatSpread(75));r.scale.y=THREE.MathUtils.randFloat(.5,1);r.rotation.set(Math.random(),Math.random(),Math.random());r.castShadow=true;r.receiveShadow=true;r.userData.hits=0;scene.add(r);rocks.push(r)}
// Guaranteed starter stone beside spawn for the first gathering tutorial
const starterRock=new THREE.Mesh(new THREE.DodecahedronGeometry(.85,0),rockMat);starterRock.position.set(-2.4,.45,8.5);starterRock.scale.y=.7;starterRock.userData.hits=0;starterRock.castShadow=true;scene.add(starterRock);rocks.push(starterRock);
// Player: muted field jacket, backpack and head
const player=new THREE.Group();scene.add(player);
const jacket=new THREE.Mesh(new THREE.CapsuleGeometry(.43,.85,4,8),new THREE.MeshStandardMaterial({color:0x59634c,roughness:.95}));jacket.position.y=1.15;jacket.castShadow=true;player.add(jacket);
const head=new THREE.Mesh(new THREE.SphereGeometry(.27,12,10),new THREE.MeshStandardMaterial({color:0xb58c6c,roughness:1}));head.position.y=1.95;head.castShadow=true;player.add(head);
const hair=new THREE.Mesh(new THREE.SphereGeometry(.275,12,8,0,Math.PI*2,0,Math.PI*.52),new THREE.MeshStandardMaterial({color:0x292a24}));hair.position.y=2.03;player.add(hair);
const pack=new THREE.Mesh(new THREE.BoxGeometry(.52,.68,.28),new THREE.MeshStandardMaterial({color:0x393b30,roughness:1}));pack.position.set(0,1.25,.48);pack.castShadow=true;player.add(pack);
for(const x of [-.22,.22]){const leg=new THREE.Mesh(new THREE.CylinderGeometry(.14,.16,.72,7),new THREE.MeshStandardMaterial({color:0x343b32}));leg.position.set(x,.38,0);player.add(leg)}

player.position.set(0,0,8);
// First infected: slow patrol, detects the player, then pursues and attacks at close range
const infected=new THREE.Group();infected.scale.setScalar(1.12);scene.add(infected);infected.position.set(.8,0,2);
const zombieSkin=new THREE.MeshStandardMaterial({color:0x78806a,roughness:1});
const tornClothes=new THREE.MeshStandardMaterial({color:0x51483d,roughness:1});
const zombieBody=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.8,4,7),tornClothes);zombieBody.position.y=1.05;zombieBody.castShadow=true;infected.add(zombieBody);
const zombieHead=new THREE.Mesh(new THREE.SphereGeometry(.29,10,9),zombieSkin);zombieHead.position.set(0,1.85,-.02);zombieHead.castShadow=true;infected.add(zombieHead);
const eyeMat=new THREE.MeshBasicMaterial({color:0xd5a36a});
for(const ex of [-.105,.105]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.035,6,6),eyeMat);eye.position.set(ex,1.89,-.27);infected.add(eye)}
for(const side of [-1,1]){const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.55,3,6),zombieSkin);arm.position.set(side*.48,1.12,-.12);arm.rotation.z=side*.22;infected.add(arm);const leg=new THREE.Mesh(new THREE.CylinderGeometry(.13,.16,.68,6),tornClothes);leg.position.set(side*.19,.35,0);infected.add(leg)}
const infectedShadow=new THREE.Mesh(new THREE.CircleGeometry(.58,16),new THREE.MeshBasicMaterial({color:0x080b08,transparent:true,opacity:.4}));infectedShadow.rotation.x=-Math.PI/2;infectedShadow.position.y=.02;infected.add(infectedShadow);
const infectedMarker=new THREE.Mesh(new THREE.TorusGeometry(.78,.055,6,28),new THREE.MeshStandardMaterial({color:0x9d4033,emissive:0x54170f,emissiveIntensity:.8,roughness:.8}));infectedMarker.rotation.x=Math.PI/2;infectedMarker.position.y=.035;infected.add(infectedMarker);
const infectedHome=new THREE.Vector3(.8,0,2);let infectedMode='wander',wanderClock=0,attackClock=0,playerHP=100,infectedHP=100,infectedAlive=true,attackCooldown=0,hitFlash=0;
const hpText=document.querySelector('#hpText'),hpFill=document.querySelector('#hpFill'),enemyText=document.querySelector('#enemyText');
const enemyHealth=document.querySelector('#enemyHealth'),enemyHPText=document.querySelector('#enemyHPText'),enemyHPFill=document.querySelector('#enemyHPFill');
document.querySelector('#attack').addEventListener('click',()=>{if(!infectedAlive){hint.textContent='附近没有可攻击的感染者';return}const d=Math.hypot(player.position.x-infected.position.x,player.position.z-infected.position.z);if(d>2.8){hint.textContent='距离太远，靠近感染者再攻击';return}if(attackCooldown>0)return;attackCooldown=.55;infectedHP=Math.max(0,infectedHP-25);enemyHealth.style.display='block';enemyHPText.textContent=infectedHP;enemyHPFill.style.width=infectedHP+'%';hitFlash=.22;zombieBody.material.emissive.setHex(0x7a2118);zombieBody.material.emissiveIntensity=1.2;infected.position.x+=(infected.position.x-player.position.x)*.12;infected.position.z+=(infected.position.z-player.position.z)*.12;if(infectedHP===0){infectedAlive=false;scene.remove(infected);enemyText.textContent='感染者已被击败';hint.textContent='感染者已倒下！'}else{hint.textContent='命中感染者！生命值 -25'}});
function updateInfected(dt){
 if(!infectedAlive)return;attackCooldown=Math.max(0,attackCooldown-dt);if(hitFlash>0){hitFlash-=dt;if(hitFlash<=0){zombieBody.material.emissive.setHex(0x000000);zombieBody.material.emissiveIntensity=0}}
 const dx=player.position.x-infected.position.x,dz=player.position.z-infected.position.z,dist=Math.hypot(dx,dz);
 if(dist<10)infectedMode='chase';else if(dist>15)infectedMode='wander';
 if(infectedMode==='chase'&&dist>1.35){infected.position.x+=dx/dist*dt*1.05;infected.position.z+=dz/dist*dt*1.05;infected.rotation.y=Math.atan2(dx,dz)}
 else if(infectedMode==='wander'){wanderClock+=dt;const a=Math.sin(wanderClock*.55)*.45;infected.position.x=infectedHome.x+Math.sin(wanderClock*.35)*1.8;infected.position.z=infectedHome.z+Math.cos(wanderClock*.35)*1.8;infected.rotation.y=a}
 if(infectedMode==='chase'&&dist<=1.45){attackClock-=dt;if(attackClock<=0){playerHP=Math.max(0,playerHP-8);attackClock=1.5;hpText.textContent=playerHP;hpFill.style.width=playerHP+'%';hint.textContent=playerHP>0?'感染者攻击了你！生命值 -8':'你已倒下，请重新开始';}}
 else attackClock=0;
 enemyText.textContent=dist<10?'附近：感染者正在追击！':'附近：感染者游荡中';
}

const shadow=new THREE.Mesh(new THREE.CircleGeometry(.65,20),new THREE.MeshBasicMaterial({color:0x11150f,transparent:true,opacity:.35}));shadow.rotation.x=-Math.PI/2;shadow.position.y=.015;player.add(shadow);
let yaw=0,moveX=0,moveY=0,cameraYaw=0,cameraPitch=.18;
const clock=new THREE.Clock();
const joy=document.querySelector('#joy'),stick=document.querySelector('#stick');let joyId=null;
function setJoy(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=43,l=Math.hypot(dx,dy);if(l>max){dx=dx/l*max;dy=dy/l*max}moveX=dx/max;moveY=dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`}
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(joyId);setJoy(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)setJoy(e)});
function endJoy(){joyId=null;moveX=moveY=0;stick.style.transform='translate(0,0)'}
joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);
const look=document.querySelector('#look');let lookId=null,lastX=0,lastY=0;
look.addEventListener('pointerdown',e=>{lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;look.setPointerCapture(lookId)});
look.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;cameraYaw-=(e.clientX-lastX)*.006;cameraPitch=THREE.MathUtils.clamp(cameraPitch+(e.clientY-lastY)*.004,-.05,.75);lastX=e.clientX;lastY=e.clientY});
function endLook(){lookId=null}look.addEventListener('pointerup',endLook);look.addEventListener('pointercancel',endLook);
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let wood=0,stone=0;
const hint=document.querySelector('#hint'),action=document.querySelector('#action');
function nearest(list){let found=null,dist=3.2;for(const obj of list){const d=Math.hypot(obj.position.x-player.position.x,obj.position.z-player.position.z);if(d<dist){dist=d;found=obj}}return found}
function refreshInventory(){document.querySelector('#wood').textContent=wood;document.querySelector('#stone').textContent=stone;document.querySelector('#bagWood').textContent=wood;document.querySelector('#bagStone').textContent=stone}
const bagPanel=document.querySelector('#bagPanel');
document.querySelector('#bagButton').addEventListener('click',()=>{bagPanel.classList.add('open');bagPanel.setAttribute('aria-hidden','false')});
function closeBag(){bagPanel.classList.remove('open');bagPanel.setAttribute('aria-hidden','true')}
document.querySelector('#bagClose').addEventListener('click',closeBag);
bagPanel.addEventListener('click',e=>{if(e.target===bagPanel)closeBag()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeBag()});
action.addEventListener('click',()=>{
 const t=nearest(trees),r=nearest(rocks);
 if(t){t.userData.hits++;if(t.userData.hits>=3){scene.remove(t);trees.splice(trees.indexOf(t),1);wood+=3;refreshInventory();hint.textContent='获得木头 ×3'}else{hint.textContent='正在砍伐树木…（'+t.userData.hits+'/3）'}}
 else if(r){r.userData.hits++;if(r.userData.hits>=2){scene.remove(r);rocks.splice(rocks.indexOf(r),1);stone+=2;refreshInventory();hint.textContent='获得石头 ×2'}else{hint.textContent='正在采集石块…（1/2）'}}
 else{hint.textContent='靠近树木或石块后才能采集'}
 setTimeout(()=>{if(hint.textContent!=='秋日森林 · 安全区外围')hint.textContent='秋日森林 · 安全区外围'},1700)
});
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);
let ix=moveX+(keys.d?1:0)-(keys.a?1:0),iy=moveY+(keys.s?1:0)-(keys.w?1:0);const len=Math.hypot(ix,iy);if(len>1){ix/=len;iy/=len}
const moving=Math.hypot(ix,iy)>.08;
if(moving){const forward=new THREE.Vector3(Math.sin(cameraYaw),0,Math.cos(cameraYaw));const right=new THREE.Vector3(forward.z,0,-forward.x);const dir=forward.multiplyScalar(-iy).add(right.multiplyScalar(ix)).normalize();player.position.addScaledVector(dir,dt*3.2);yaw=Math.atan2(dir.x,dir.z);player.rotation.y=THREE.MathUtils.lerp(player.rotation.y,yaw,Math.min(1,dt*10))}
updateInfected(dt);
const target=new THREE.Vector3(player.position.x,1.25,player.position.z);
const distance=6.3, horiz=Math.cos(cameraPitch)*distance, vert=Math.sin(cameraPitch)*distance+1.4;
const desired=new THREE.Vector3(target.x+Math.sin(cameraYaw)*horiz,target.y+vert,target.z+Math.cos(cameraYaw)*horiz);
camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(target);
renderer.render(scene,camera)}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});
document.querySelector('#loading').style.display='none';
</script>
</body></html>
